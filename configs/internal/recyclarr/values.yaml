defaultPodOptions:
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

controllers:
  main:
    type: cronjob
    cronjob:
      schedule: "0 4 1 * *"
      concurrencyPolicy: Forbid
      successfulJobsHistory: 3
      failedJobsHistory: 3
    containers:
      main:
        image:
          repository: ghcr.io/recyclarr/recyclarr
          # 8.x tracks the config-templates `master` registry (the `v8` branch
          # merged into master 2026-08-07 and was deleted); full TRaSH templates
          # replace the old per-include registry.
          tag: "8.7.2"
          pullPolicy: IfNotPresent
        command: ["recyclarr", "sync"]
        env:
          TZ: America/Toronto
        envFrom:
          - secretRef:
              name: recyclarr-secret

persistence:
  # /config must be writable — recyclarr clones the guide/template repos there each run
  config:
    type: emptyDir
    globalMounts:
      - path: /config
  # mount the template config files (recyclarr 8.x `config create -t` output),
  # read-only, via subPath so they don't shadow /config
  recyclarr-config:
    type: configMap
    name: recyclarr-config
    globalMounts:
      - path: /config/configs/hd-bluray-web.yml
        subPath: hd-bluray-web.yml
      - path: /config/configs/web-1080p.yml
        subPath: web-1080p.yml
