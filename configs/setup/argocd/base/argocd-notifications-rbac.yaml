# argocd v3.4.8 install.yaml only grants the notifications controller a
# namespaced Role covering applications/appprojects. But: appprojects is
# cluster-scoped (a Role cannot grant it at all), and applications is
# namespaced where a Role only covers the argocd namespace — while the
# controller lists cluster-wide, so its app informer 403'd on every list
# (verified: auth can-i = no). All app-driven notification triggers
# (on-sync-failed, on-health-degraded, ...) were silently dead, and the
# controller spammed "cannot list applications: forbidden" ~every 30s.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-notifications-controller
  labels:
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "update", "patch"]  # same verbs as the upstream Role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-notifications-controller
  labels:
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-notifications-controller
subjects:
  - kind: ServiceAccount
    name: argocd-notifications-controller
    namespace: argocd
